[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "External control plane for AI coding agents: deterministic rules + local semantic scorer, audit trail, human-resumable interventions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentStateEngine contributors" }]
keywords = ["ai", "agent", "guardrails", "safety", "observability", "cost-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
agentguard = "agentguard.cli:main"

[tool.setuptools]
packages = ["agentguard"]
