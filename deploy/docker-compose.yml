# Edward deployment — team-LAN topology (deployment tier B).
#
#   scorer  : Qwen/Qwen3.5-4B scoring endpoint (GET /health, POST /v1/score)
#             LAN only, no auth — never expose beyond the trusted network.
#   edward  : control plane wrapping agent commands in the shared workspace.
#
# Usage:
#   docker compose run --rm edward wrap -- pi "fix the flaky test"
#
# Point EDWARD_SCORER_URL at an existing scorer instead of starting one:
#   docker compose run --rm -e EDWARD_SCORER_URL=http://<gpu-box>:8000 \
#       edward wrap --no-scorer -- python my_agent.py

services:
  scorer:
    image: ghcr.io/OWNER/edward-scorer:latest   # your scoring-server image
    build: ./scorer                             # or a build context with server.py
    restart: on-failure
    environment:
      MODEL: Qwen/Qwen3.5-4B
    volumes:
      - ./models:/models:ro                     # local weights or HF cache
    # GPU host only:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  edward:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      - scorer
    environment:
      EDWARD_SCORER_URL: http://scorer:8000
    working_dir: /workspace
    volumes:
      - ./workspace:/workspace
    # override the command with your guarded task:
    command: ["wrap", "--no-scorer", "--", "python", "-c", "print('hello from edward')"]
